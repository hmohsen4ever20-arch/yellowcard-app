name: Build BET CARD APK & PlayStore AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          yes | $SDKMGR --licenses > /dev/null 2>&1 || true
          $SDKMGR "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate BET Yellow Card Icon if Missing
        run: |
          if [ ! -f icon.png ]; then
            sudo apt-get update && sudo apt-get install -y python3-pil fonts-dejavu-core
            python3 -c '
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new("RGB", (512, 512), "#090d16")
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([116, 56, 396, 456], radius=32, fill="#eab308", outline="#fef08a", width=8)
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 96)
          except:
              font = ImageFont.load_default()
          bbox = draw.textbbox((0, 0), "BET", font=font)
          w, h = bbox[2] - bbox[0], bbox[3] - bbox[1]
          draw.text(((512 - w) / 2, (512 - h) / 2 - 10), "BET", fill="#090d16", font=font)
          img.save("icon.png")
          '
          fi

      - name: Build Signed BET CARD APK & AAB
        run: |
          npm install -g cordova
          cordova create app com.betcard.app "BET CARD"
          cp index.html app/www/index.html
          if [ -d data ]; then cp -r data app/www/data; fi
          cp icon.png app/icon.png

          cd app
          sed -i 's/<\/widget>/<icon src="icon.png" \/><allow-navigation href="*"\/><access origin="*"\/><preference name="Orientation" value="portrait"\/><preference name="AndroidInsecureFileModeEnabled" value="false"\/><\/widget>/' config.xml
          cordova platform add android@13.0.0

          keytool -genkeypair -v -keystore key.keystore -alias betcard -keyalg RSA -keysize 2048 -validity 10000 -storepass BetCard2026 -keypass BetCard2026 -dname "CN=BET CARD, O=BET CARD, C=GB"

          cat << 'EOF' > build-apk.json
          {
            "android": {
              "release": {
                "keystore": "key.keystore",
                "storePassword": "BetCard2026",
                "alias": "betcard",
                "password": "BetCard2026",
                "packageType": "apk"
              }
            }
          }
          EOF

          cat << 'EOF' > build-aab.json
          {
            "android": {
              "release": {
                "keystore": "key.keystore",
                "storePassword": "BetCard2026",
                "alias": "betcard",
                "password": "BetCard2026",
                "packageType": "bundle"
              }
            }
          }
          EOF

          cordova build android --release --buildConfig=build-apk.json
          cordova build android --release --buildConfig=build-aab.json

          cp platforms/android/app/build/outputs/apk/release/app-release.apk ../BET-CARD.apk
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab ../BET-CARD-PlayStore.aab

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "BET CARD Android App (v1.0.${{ github.run_number }})"
          files: |
            BET-CARD.apk
            BET-CARD-PlayStore.aab
