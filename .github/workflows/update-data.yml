name: Update Football CSV Data

on:
  schedule:
    - cron: '0 6,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Latest 26/27 League CSVs
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          for code in SP1 E0 I1 D1 F1 P1 T1 G1 N1; do
            echo "Fetching ${code} (26/27)..."
            curl -fsSL --retry 3 -A "$UA" "https://www.football-data.co.uk/mmz4281/2627/${code}.csv" -o "data/${code}.tmp" || true
            if [ -s "data/${code}.tmp" ] && grep -q "HomeTeam" "data/${code}.tmp"; then
              mv "data/${code}.tmp" "data/${code}.csv"
            else
              rm -f "data/${code}.tmp"
              curl -fsSL --retry 2 -A "$UA" "https://www.football-data.co.uk/mmz4281/2526/${code}.csv" -o "data/${code}.tmp" || true
              if [ -s "data/${code}.tmp" ] && grep -q "HomeTeam" "data/${code}.tmp"; then
                mv "data/${code}.tmp" "data/${code}.csv"
              else
                rm -f "data/${code}.tmp"
              fi
            fi
          done

          curl -fsSL --retry 3 -A "$UA" "https://www.football-data.co.uk/fixtures.csv" -o "data/fd_fixtures.csv" || true

      - name: Build Unified Upcoming Fixtures (Football-Data + ESPN 14-Day Backup)
        run: |
          python3 - << 'PYEOF'
          import csv, datetime, difflib, json, os, unicodedata, urllib.request

          LEAGUES = {
              'SP1': 'esp.1', 'E0': 'eng.1', 'I1': 'ita.1', 'D1': 'ger.1',
              'F1': 'fra.1',  'P1': 'por.1', 'T1': 'tur.1', 'G1': 'gre.1', 'N1': 'ned.1'
          }

          ALIASES = {
              'manchester united': 'Man United', 'manchester city': 'Man City',
              'nottingham forest': "Nott'm Forest", 'wolverhampton wanderers': 'Wolves',
              'newcastle united': 'Newcastle', 'tottenham hotspur': 'Tottenham',
              'west ham united': 'West Ham', 'brighton & hove albion': 'Brighton',
              'afc bournemouth': 'Bournemouth', 'leicester city': 'Leicester',
              'ipswich town': 'Ipswich', 'leeds united': 'Leeds',
              'atletico madrid': 'Ath Madrid', 'athletic club': 'Ath Bilbao',
              'athletic bilbao': 'Ath Bilbao', 'real betis': 'Betis',
              'celta vigo': 'Celta', 'rcd espanyol': 'Espanol', 'espanyol': 'Espanol',
              'deportivo alaves': 'Alaves', 'rayo vallecano': 'Vallecano',
              'real sociedad': 'Sociedad', 'real valladolid': 'Valladolid',
              'paris saint-germain': 'Paris SG', 'olympique marseille': 'Marseille',
              'olympique lyonnais': 'Lyon', 'as monaco': 'Monaco',
              'stade rennais': 'Rennes', 'stade brestois': 'Brest',
              'rc lens': 'Lens', 'rc strasbourg': 'Strasbourg', 'fc nantes': 'Nantes',
              'stade de reims': 'Reims', 'internazionale': 'Inter', 'inter milan': 'Inter',
              'ac milan': 'Milan', 'hellas verona': 'Verona', 'as roma': 'Roma',
              'bayer leverkusen': 'Leverkusen', 'borussia dortmund': 'Dortmund',
              'borussia monchengladbach': "M'gladbach", 'eintracht frankfurt': 'Ein Frankfurt',
              'bayern munich': 'Bayern Munich', 'vfb stuttgart': 'Stuttgart',
              'sc freiburg': 'Freiburg', 'vfl wolfsburg': 'Wolfsburg',
              'sv werder bremen': 'Werder Bremen', 'fsv mainz 05': 'Mainz',
              'tsg hoffenheim': 'Hoffenheim', 'fc augsburg': 'Augsburg',
              'fc st. pauli': 'St Pauli', '1. fc union berlin': 'Union Berlin',
              '1. fc heidenheim 1846': 'Heidenheim', 'sporting cp': 'Sp Lisbon',
              'fc porto': 'Porto', 'sl benfica': 'Benfica', 'sporting braga': 'Sp Braga'
          }

          def norm(s):
              s = unicodedata.normalize('NFKD', s).encode('ascii', 'ignore').decode('ascii')
              return ' '.join(s.lower().replace('-', ' ').split())

          def load_known_teams(code):
              path = f"data/{code}.csv"
              teams = set()
              if not os.path.exists(path):
                  return teams
              with open(path, encoding='utf-8-sig', errors='ignore') as f:
                  for row in csv.DictReader(f):
                      if row.get('HomeTeam'): teams.add(row['HomeTeam'].strip())
                      if row.get('AwayTeam'): teams.add(row['AwayTeam'].strip())
              return teams

          def map_team(raw, known):
              if not known:
                  return raw
              n = norm(raw)
              for k in known:
                  if norm(k) == n:
                      return k
              if n in ALIASES and ALIASES[n] in known:
                  return ALIASES[n]
              sub = [k for k in known if len(norm(k)) >= 4 and (norm(k) in n or n in norm(k))]
              if sub:
                  return max(sub, key=len)
              best = difflib.get_close_matches(raw, list(known), n=1, cutoff=0.55)
              return best[0] if best else raw

          today = datetime.datetime.utcnow().date()
          end_day = today + datetime.timedelta(days=14)
          date_range = f"{today.strftime('%Y%m%d')}-{end_day.strftime('%Y%m%d')}"

          upcoming = []
          covered_divs = set()

          # 1. Read valid future fixtures from football-data.co.uk first (includes Bet365 odds)
          if os.path.exists("data/fd_fixtures.csv"):
              with open("data/fd_fixtures.csv", encoding='utf-8-sig', errors='ignore') as f:
                  for row in csv.DictReader(f):
                      div = (row.get('Div') or '').strip()
                      if div not in LEAGUES:
                          continue
                      d_str = (row.get('Date') or '').strip()
                      dt = None
                      for fmt in ('%d/%m/%Y', '%d/%m/%y'):
                          try:
                              dt = datetime.datetime.strptime(d_str, fmt).date()
                              break
                          except ValueError:
                              pass
                      if dt and dt >= today:
                          upcoming.append({
                              'sort': dt.isoformat(),
                              'Div': div,
                              'Date': dt.strftime('%d/%m/%Y'),
                              'HomeTeam': (row.get('HomeTeam') or '').strip(),
                              'AwayTeam': (row.get('AwayTeam') or '').strip(),
                              'Referee': (row.get('Referee') or '').strip(),
                              'B365H': (row.get('B365H') or row.get('AvgH') or '').strip(),
                              'B365A': (row.get('B365A') or row.get('AvgA') or '').strip(),
                          })
                          covered_divs.add(div)
              os.remove("data/fd_fixtures.csv")

          # 2. For leagues missing upcoming matches, fetch next 14 days from ESPN public API
          for code, slug in LEAGUES.items():
              if code in covered_divs:
                  continue
              known = load_known_teams(code)
              url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/scoreboard?dates={date_range}"
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      payload = json.loads(resp.read().decode('utf-8'))
                  for ev in payload.get('events', []):
                      state = ev.get('status', {}).get('type', {}).get('state', '')
                      if state != 'pre':
                          continue
                      iso_date = ev.get('date', '')[:10]
                      dt = datetime.datetime.strptime(iso_date, '%Y-%m-%d').date()
                      if dt < today:
                          continue
                      comps = ev.get('competitions', [{}])[0].get('competitors', [])
                      home = next((c['team']['displayName'] for c in comps if c.get('homeAway') == 'home'), '')
                      away = next((c['team']['displayName'] for c in comps if c.get('homeAway') == 'away'), '')
                      if home and away:
                          upcoming.append({
                              'sort': dt.isoformat(),
                              'Div': code,
                              'Date': dt.strftime('%d/%m/%Y'),
                              'HomeTeam': map_team(home, known),
                              'AwayTeam': map_team(away, known),
                              'Referee': '',
                              'B365H': '',
                              'B365A': '',
                          })
              except Exception as e:
                  print(f"ESPN skip {code}: {e}")

          upcoming.sort(key=lambda x: (x['sort'], x['Div']))
          with open("data/fixtures.csv", "w", newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=['Div', 'Date', 'HomeTeam', 'AwayTeam', 'Referee', 'B365H', 'B365A'])
              writer.writeheader()
              for r in upcoming:
                  r.pop('sort', None)
                  writer.writerow(r)

          print(f"Saved {len(upcoming)} upcoming fixtures.")
          PYEOF
          date -u +"%Y-%m-%d %H:%M UTC" > data/last_updated.txt
          ls -lh data/

      - name: Commit & Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto update football CSV & upcoming fixtures"
          git push
