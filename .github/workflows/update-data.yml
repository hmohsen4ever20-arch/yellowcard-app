name: Update Football Data (Rate-Limit Safe Bundle)

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch APIs Safely & Build Compact bundle.json
        run: |
          mkdir -p data
          python3 - << 'PYEOF'
          import csv, datetime, difflib, io, json, os, time, unicodedata, urllib.request, urllib.error

          LEAGUES = {
              'SP1': 'esp.1', 'E0': 'eng.1', 'I1': 'ita.1', 'D1': 'ger.1',
              'F1': 'fra.1',  'P1': 'por.1', 'T1': 'tur.1', 'G1': 'gre.1', 'N1': 'ned.1'
          }

          ALIASES = {
              'manchester united': 'Man United', 'manchester city': 'Man City',
              'nottingham forest': "Nott'm Forest", 'wolverhampton wanderers': 'Wolves',
              'newcastle united': 'Newcastle', 'tottenham hotspur': 'Tottenham',
              'west ham united': 'West Ham', 'brighton & hove albion': 'Brighton',
              'afc bournemouth': 'Bournemouth', 'leicester city': 'Leicester',
              'ipswich town': 'Ipswich', 'leeds united': 'Leeds',
              'atletico madrid': 'Ath Madrid', 'athletic club': 'Ath Bilbao',
              'athletic bilbao': 'Ath Bilbao', 'real betis': 'Betis',
              'celta vigo': 'Celta', 'rcd espanyol': 'Espanol', 'espanyol': 'Espanol',
              'deportivo alaves': 'Alaves', 'rayo vallecano': 'Vallecano',
              'real sociedad': 'Sociedad', 'real valladolid': 'Valladolid',
              'paris saint-germain': 'Paris SG', 'olympique marseille': 'Marseille',
              'olympique lyonnais': 'Lyon', 'as monaco': 'Monaco',
              'stade rennais': 'Rennes', 'stade brestois': 'Brest',
              'rc lens': 'Lens', 'rc strasbourg': 'Strasbourg', 'fc nantes': 'Nantes',
              'internazionale': 'Inter', 'inter milan': 'Inter', 'ac milan': 'Milan',
              'hellas verona': 'Verona', 'as roma': 'Roma', 'bayer leverkusen': 'Leverkusen',
              'borussia dortmund': 'Dortmund', 'borussia monchengladbach': "M'gladbach",
              'eintracht frankfurt': 'Ein Frankfurt', 'vfb stuttgart': 'Stuttgart',
              'sc freiburg': 'Freiburg', 'vfl wolfsburg': 'Wolfsburg',
              'sv werder bremen': 'Werder Bremen', 'fsv mainz 05': 'Mainz',
              'tsg hoffenheim': 'Hoffenheim', 'fc augsburg': 'Augsburg',
              'fc st. pauli': 'St Pauli', '1. fc union berlin': 'Union Berlin',
              '1. fc heidenheim 1846': 'Heidenheim', 'sporting cp': 'Sp Lisbon',
              'fc porto': 'Porto', 'sl benfica': 'Benfica', 'sporting braga': 'Sp Braga'
          }

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              'Accept': 'text/csv,application/json,*/*'
          }

          def fetch_safe(url, retries=3, base_delay=2.0):
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          return resp.read().decode('utf-8-sig', errors='ignore')
                  except urllib.error.HTTPError as e:
                      if e.code == 429:
                          wait = min(int(e.headers.get('Retry-After', base_delay * (2 ** attempt))), 30)
                          print(f"Rate limited (429) on {url}. Waiting {wait}s...")
                          time.sleep(wait)
                      elif e.code in (500, 502, 503, 504):
                          time.sleep(base_delay * (2 ** attempt))
                      else:
                          return None
                  except Exception as e:
                      print(f"Fetch retry {attempt+1} for {url}: {e}")
                      time.sleep(base_delay * (2 ** attempt))
              return None

          def to_num(v):
              try:
                  x = float(v)
                  return round(x, 2) if x == x else None
              except (TypeError, ValueError):
                  return None

          def norm(s):
              s = unicodedata.normalize('NFKD', s).encode('ascii', 'ignore').decode('ascii')
              return ' '.join(s.lower().replace('-', ' ').split())

          def map_team(raw, known):
              if not known:
                  return raw
              n = norm(raw)
              for k in known:
                  if norm(k) == n:
                      return k
              if n in ALIASES and ALIASES[n] in known:
                  return ALIASES[n]
              sub = [k for k in known if len(norm(k)) >= 4 and (norm(k) in n or n in norm(k))]
              if sub:
                  return max(sub, key=len)
              best = difflib.get_close_matches(raw, list(known), n=1, cutoff=0.55)
              return best[0] if best else raw

          # Load previous bundle so API hiccups never wipe existing good data
          prev_bundle = {'leagues': {}, 'fixtures': []}
          if os.path.exists('data/bundle.json'):
              try:
                  with open('data/bundle.json', encoding='utf-8') as f:
                      prev_bundle = json.load(f)
              except Exception:
                  pass

          leagues_data = {}
          for code in LEAGUES:
              time.sleep(1.5)  # Polite pacing to avoid API throttling
              txt = fetch_safe(f"https://www.football-data.co.uk/mmz4281/2627/{code}.csv")
              if not txt or 'HomeTeam' not in txt:
                  txt = fetch_safe(f"https://www.football-data.co.uk/mmz4281/2526/{code}.csv")

              parsed = []
              if txt and 'HomeTeam' in txt:
                  for row in csv.DictReader(io.StringIO(txt)):
                      h = (row.get('HomeTeam') or '').strip()
                      a = (row.get('AwayTeam') or '').strip()
                      hy, ay = to_num(row.get('HY')), to_num(row.get('AY'))
                      if not h or not a or hy is None or ay is None:
                          continue
                      parsed.append([
                          (row.get('Date') or '').strip(),
                          h, a,
                          (row.get('Referee') or '').strip(),
                          to_num(row.get('HF')), to_num(row.get('AF')),
                          hy, ay,
                          to_num(row.get('B365H') or row.get('AvgH')),
                          to_num(row.get('B365A') or row.get('AvgA'))
                      ])

              if parsed:
                  leagues_data[code] = parsed
                  print(f"Updated {code}: {len(parsed)} matches")
              else:
                  leagues_data[code] = prev_bundle.get('leagues', {}).get(code, [])
                  print(f"Kept cached {code}: {len(leagues_data[code])} matches")

          # Build upcoming fixtures (Football-Data first, ESPN backup with pacing)
          today = datetime.datetime.utcnow().date()
          end_day = today + datetime.timedelta(days=14)
          date_range = f"{today.strftime('%Y%m%d')}-{end_day.strftime('%Y%m%d')}"
          upcoming = []
          covered = set()

          time.sleep(1.5)
          fd_fix = fetch_safe("https://www.football-data.co.uk/fixtures.csv")
          if fd_fix and 'HomeTeam' in fd_fix:
              for row in csv.DictReader(io.StringIO(fd_fix)):
                  div = (row.get('Div') or '').strip()
                  if div not in LEAGUES:
                      continue
                  d_str = (row.get('Date') or '').strip()
                  dt = None
                  for fmt in ('%d/%m/%Y', '%d/%m/%y'):
                      try:
                          dt = datetime.datetime.strptime(d_str, fmt).date()
                          break
                      except ValueError:
                          pass
                  if dt and dt >= today:
                      upcoming.append((dt.isoformat(), [
                          div, dt.strftime('%d/%m/%Y'),
                          (row.get('HomeTeam') or '').strip(),
                          (row.get('AwayTeam') or '').strip(),
                          (row.get('Referee') or '').strip(),
                          to_num(row.get('B365H') or row.get('AvgH')),
                          to_num(row.get('B365A') or row.get('AvgA'))
                      ]))
                      covered.add(div)

          for code, slug in LEAGUES.items():
              if code in covered:
                  continue
              time.sleep(1.2)
              espn_txt = fetch_safe(f"https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/scoreboard?dates={date_range}")
              if not espn_txt:
                  continue
              known = {r[1] for r in leagues_data.get(code, [])} | {r[2] for r in leagues_data.get(code, [])}
              try:
                  payload = json.loads(espn_txt)
                  for ev in payload.get('events', []):
                      if ev.get('status', {}).get('type', {}).get('state') != 'pre':
                          continue
                      dt = datetime.datetime.strptime(ev.get('date', '')[:10], '%Y-%m-%d').date()
                      if dt < today:
                          continue
                      comps = ev.get('competitions', [{}])[0].get('competitors', [])
                      h = next((c['team']['displayName'] for c in comps if c.get('homeAway') == 'home'), '')
                      a = next((c['team']['displayName'] for c in comps if c.get('homeAway') == 'away'), '')
                      if h and a:
                          upcoming.append((dt.isoformat(), [
                              code, dt.strftime('%d/%m/%Y'),
                              map_team(h, known), map_team(a, known),
                              '', None, None
                          ]))
              except Exception as e:
                  print(f"ESPN parse skip {code}: {e}")

          upcoming.sort(key=lambda x: (x[0], x[1][0]))
          fixtures_list = [x[1] for x in upcoming]

          # Keep still-valid cached fixtures if all fixture APIs failed
          if not fixtures_list and prev_bundle.get('fixtures'):
              for row in prev_bundle['fixtures']:
                  try:
                      if datetime.datetime.strptime(row[1], '%d/%m/%Y').date() >= today:
                          fixtures_list.append(row)
                  except Exception:
                      pass

          now_utc = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          bundle = {
              'updated_at': now_utc,
              'leagues': leagues_data,
              'fixtures': fixtures_list
          }

          # Save single minified JSON bundle (~80KB total instead of ~2.5MB CSVs)
          with open('data/bundle.json', 'w', encoding='utf-8') as f:
              json.dump(bundle, f, ensure_ascii=False, separators=(',', ':'))

          with open('data/last_updated.txt', 'w', encoding='utf-8') as f:
              f.write(now_utc)

          print(f"Bundle built successfully: {os.path.getsize('data/bundle.json')/1024:.1f} KB, {len(fixtures_list)} upcoming fixtures")
          PYEOF

      - name: Commit & Push Only If Data Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bundle.json data/last_updated.txt
          git diff --staged --quiet || git commit -m "Update compact football data bundle"
          git push
